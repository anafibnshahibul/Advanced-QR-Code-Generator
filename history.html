<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free QR Code Generator">
    <meta name="keywords" content="QR Code Generator, QR Code, Advanced QR Code Generator, QR Code History">
    <title>QR Code History</title>
    
    <link rel="icon" href="assets/img/icon.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        
        <div class="header-content"> 
            <h1>QR Code Generation History</h1>
        </div>
        
        <div class="card history-list-container">
            
            <a href="index.html" class="history-link" title="Go back">
                <i class="fas fa-arrow-left"></i> Back to Generator
            </a>
            
            <div class="history-controls">
                <input type="text" id="search-history" placeholder="Search QR Content or URL..." onkeyup="renderHistory()">
            </div>
            
            <div id="history-list">
                <p>Loading history...</p>
            </div>
            <button id="clear-history-btn" disabled>Clear All History</button>
        </div>
    </div>
    
    <script src="assets/js/script.js"></script>
</body>
</html>
