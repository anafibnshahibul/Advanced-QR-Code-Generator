<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free QR Code Generator">
    <meta name="keywords" content="QR Code Generator, QR Code, Advanced QR Code Generator, QR Code History">
    <title>Advanced QR Code Generator</title>
    
    <link rel="icon" href="assets/img/icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="assets/css/style.css" rel="stylesheet">

    <script src="assets/cdnjs/qrcode.min.js"></script>
</head>
<body>
    <div class="container"> 
        <div class="header-content">
            <img src="assets/img/icon.png" alt="QR Icon">
            <h1>Advanced QR Code Generator</h1>
        </div>

        <div class="card input-section">
            
            <a href="history.html" class="history-link" title="View History">
                <i class="fas fa-history"></i> QR History
            </a>
            
            <label for="url-input">Write your URL or Text:</label>
            <input type="url" id="url-input" placeholder="e.g. https://example.com or any text">
            
            <div class="customization-group">
                <div class="customization-item">
                    <label for="color-dark">QR Code Color:</label>
                    <input type="color" id="color-dark" value="#000000">
                </div>
                
                <div class="customization-item">
                    <label for="qr-size">Size (Pixels):</label>
                    <input type="number" id="qr-size" value="250" min="100" max="500">
                </div>
            </div>

            <button onclick="handleGenerateQRCode()">Generate</button>
        </div>

        <div class="card output-section">
            <h2>Generated QR Code</h2>
            <div id="qrcode">
                <p>Provide information above to generate.</p>
            </div>
            <button id="download-btn" disabled>Download (PNG)</button>
        </div>
    </div> 
    
    <script src="assets/js/script.js"></script>
</body>
</html>
